<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J — work dump</title>
  <meta name="description" content="everything. the good, the rough, the shitposts." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Comic+Neue:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:     #0c0c10;
      --bg2:    #13131a;
      --border: #2a2a3a;
      --accent: #c8ff00;
      --dim:    #44445a;
      --text:   #c0c0d8;
      --bright: #eeeeff;
      --warn:   #ffcc00;
      --comic:  'Comic Sans MS', 'Comic Neue', cursive;
      --pixel:  'Press Start 2P', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--comic);
      font-size: 16px;
      line-height: 1.8;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #ffffff05 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--dim); }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1.5rem;
      position: relative;
      z-index: 1;
    }

    /* ── CONSTRUCTION BANNER ───────────────────────────────── */
    .site-notice {
      background: repeating-linear-gradient(
        -45deg,
        #1a1500, #1a1500 6px,
        #221d00 6px, #221d00 12px
      );
      border-bottom: 1px solid #3a3000;
      padding: 0.5rem 1.5rem;
      font-family: var(--pixel);
      font-size: 0.38rem;
      color: var(--warn);
      letter-spacing: 0.12em;
      text-align: center;
    }

    /* ── NAV ───────────────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(12,12,16,0.96);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
    }

    nav {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .nav-brand {
      font-family: var(--pixel);
      font-size: 0.6rem;
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      font-family: var(--comic);
      font-size: 1rem;
      font-weight: 700;
      color: var(--dim);
      transition: color 0.15s;
    }
    .nav-links a:hover { color: var(--bright); text-decoration: none; }
    .nav-links a.active { color: var(--accent); }

    /* ── PAGE HEADER ───────────────────────────────────────── */
    .page-header {
      padding: 4rem 0 2.5rem;
      border-bottom: 1px dashed var(--border);
    }

    .page-label {
      font-family: var(--pixel);
      font-size: 0.4rem;
      color: var(--dim);
      letter-spacing: 0.2em;
      margin-bottom: 0.7rem;
    }

    .page-title {
      font-family: var(--comic);
      font-size: 2rem;
      font-weight: 700;
      color: var(--bright);
      margin-bottom: 0.6rem;
    }

    .page-desc {
      font-size: 0.9rem;
      color: var(--dim);
      font-style: italic;
    }

    /* ── FILTER BAR ────────────────────────────────────────── */
    .filter-bar {
      padding: 1.5rem 0;
      border-bottom: 1px dashed var(--border);
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-label {
      font-family: var(--pixel);
      font-size: 0.35rem;
      color: var(--dim);
      letter-spacing: 0.15em;
      margin-right: 0.5rem;
    }

    .filter-btn {
      font-family: var(--comic);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.3rem 0.9rem;
      border: 1px solid var(--border);
      color: var(--dim);
      background: transparent;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover { border-color: var(--dim); color: var(--text); }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); }

    /* ── DUMP GRID ─────────────────────────────────────────── */
    .dump-grid {
      padding: 2.5rem 0 5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .dump-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      transition: border-color 0.15s;
      display: flex;
      flex-direction: column;
    }

    .dump-card:hover { border-color: #44445a; }

    /* thumbnail */
    .dump-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--pixel);
      font-size: 0.35rem;
      color: var(--dim);
      letter-spacing: 0.08em;
      overflow: hidden;
      position: relative;
    }

    .dump-thumb img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }

    /* audio card — no 16/9 thumb, just a waveform placeholder */
    .dump-card[data-type="audio"] .dump-thumb {
      aspect-ratio: unset;
      height: 80px;
      background: repeating-linear-gradient(
        90deg,
        var(--bg) 0px, var(--bg) 2px,
        #111120 2px, #111120 6px
      );
    }

    /* art card thumb — slightly taller */
    .dump-card[data-type="art"] .dump-thumb {
      aspect-ratio: 4/3;
    }

    .dump-body {
      padding: 1rem 1.1rem 1.2rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .dump-type {
      font-family: var(--pixel);
      font-size: 0.33rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    /* type colours */
    .dump-card[data-type="video"]  .dump-type { color: #ff6644; }
    .dump-card[data-type="art"]    .dump-type { color: #aa88ff; }
    .dump-card[data-type="audio"]  .dump-type { color: #44ddaa; }
    .dump-card[data-type="other"]  .dump-type { color: var(--dim); }

    .dump-title {
      font-family: var(--comic);
      font-size: 1rem;
      font-weight: 700;
      color: var(--bright);
      margin-bottom: 0.3rem;
    }

    .dump-desc {
      font-size: 0.82rem;
      color: var(--dim);
      flex: 1;
      margin-bottom: 1rem;
    }

    .dump-link {
      font-family: var(--pixel);
      font-size: 0.33rem;
      padding: 0.5rem 0.8rem;
      border: 1px solid var(--border);
      color: var(--dim);
      letter-spacing: 0.08em;
      transition: all 0.15s;
      display: inline-block;
      align-self: flex-start;
      text-decoration: none;
    }

    .dump-link:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

    /* hidden by filter */
    .dump-card.hidden { display: none; }

    /* empty state */
    .dump-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 0;
      font-size: 0.9rem;
      color: var(--dim);
      font-style: italic;
      display: none;
    }

    .dump-empty.visible { display: block; }

    /* ── FOOTER ────────────────────────────────────────────── */
    footer {
      position: relative;
      z-index: 1;
      padding: 2rem 1.5rem;
      border-top: 1px dashed var(--border);
    }

    .footer-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-copy { font-size: 0.85rem; color: var(--dim); }

    .footer-note {
      font-family: var(--pixel);
      font-size: 0.35rem;
      color: #222233;
      letter-spacing: 0.1em;
    }

    /* ── RESPONSIVE ────────────────────────────────────────── */
    @media (max-width: 480px) {
      .dump-grid { grid-template-columns: 1fr; }
      .footer-inner { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

<body>

  <div class="site-notice">
    ⚠ &nbsp; UNDER CONSTRUCTION &nbsp; — &nbsp; HAS BEEN SINCE 2012 &nbsp; ⚠
  </div>

  <!-- ── NAV ───────────────────────────────────────────────── -->
  <header>
    <nav>
      <span class="nav-brand">J</span>
      <ul class="nav-links">
        <li><a href="index.html">main</a></li>
        <li><a href="work-dump.html" class="active">work dump</a></li>
        <li><a href="expert-mode.html" style="font-family:var(--pixel); font-size:0.38rem; font-weight:400; letter-spacing:0.08em; color:#333344;">expert mode</a></li>
      </ul>
    </nav>
  </header>

  <!-- ── PAGE HEADER ───────────────────────────────────────── -->
  <div class="page-header">
    <div class="container">
      <p class="page-label">// everything</p>
      <h1 class="page-title">The Work Dump</h1>
      <p class="page-desc">videos, art, audio, whatever else. no curation, no agenda.</p>
    </div>
  </div>

  <!-- ── FILTER BAR ─────────────────────────────────────────── -->
  <div class="filter-bar" style="position:relative; z-index:1;">
    <div class="container" style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center;">
      <span class="filter-label">show:</span>
      <button class="filter-btn active" data-filter="all">all</button>
      <button class="filter-btn" data-filter="video">video</button>
      <button class="filter-btn" data-filter="art">art</button>
      <button class="filter-btn" data-filter="audio">audio</button>
      <button class="filter-btn" data-filter="other">other</button>
    </div>
  </div>

  <!-- ── DUMP GRID ───────────────────────────────────────────── -->
  <div style="position:relative; z-index:1;">
    <div class="container">
      <div class="dump-grid" id="grid">
        <p class="dump-empty" id="empty">nothing here yet for that filter.</p>
      </div>
    </div>
  </div>

  <!-- ── FOOTER ─────────────────────────────────────────────── -->
  <footer>
    <div class="footer-inner">
      <span class="footer-copy">© <span id="year"></span> J</span>
      <span class="footer-note">still under construction</span>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const grid  = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const btns  = document.querySelectorAll('.filter-btn');
    let   works = [];
    let   activeFilter = 'all';

    function thumbFor(entry) {
      if (entry.thumbnail) return `<img src="${entry.thumbnail}" alt="${entry.title}" />`;
      if (entry.type === 'audio') return '♪ audio';
      return 'NO PREVIEW';
    }

    function renderCards() {
      // remove old cards, keep empty msg
      grid.querySelectorAll('.dump-card').forEach(c => c.remove());

      const filtered = activeFilter === 'all'
        ? works
        : works.filter(w => w.type === activeFilter);

      empty.classList.toggle('visible', filtered.length === 0);

      filtered.forEach(entry => {
        const card = document.createElement('article');
        card.className = 'dump-card';
        card.dataset.type = entry.type;
        card.innerHTML = `
          <div class="dump-thumb">${thumbFor(entry)}</div>
          <div class="dump-body">
            <p class="dump-type">${entry.type}</p>
            <h2 class="dump-title">${entry.title}</h2>
            <p class="dump-desc">${entry.description || ''}</p>
            <a href="${entry.link}" class="dump-link" target="_blank" rel="noopener">
              ${entry.linkLabel} →
            </a>
          </div>`;
        grid.insertBefore(card, empty);
      });
    }

    btns.forEach(btn => {
      btn.addEventListener('click', () => {
        btns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        renderCards();
      });
    });

    fetch('data/works.json')
      .then(r => r.json())
      .then(data => { works = data; renderCards(); })
      .catch(() => {
        empty.textContent = 'could not load works.json.';
        empty.classList.add('visible');
      });
  </script>

</body>
</html>
